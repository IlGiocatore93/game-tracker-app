version: '3.9'

services:
  db:
    image: postgres:16
    container_name: gametracker_db
    restart: always
    environment:
      POSTGRES_USER: gametracker
      POSTGRES_PASSWORD: gametracker_pass
      POSTGRES_DB: gametracker_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gametracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./Backend
    container_name: gametracker_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://gametracker:gametracker_pass@db:5432/gametracker_db
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./Frontend
    container_name: gametracker_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data: